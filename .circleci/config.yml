version: 2.1

jobs:
  tests:
    docker:
      - image: cimg/node:24.11.0
    steps:
      - checkout
      - run:
          name: Disable Corepack
          command: sudo corepack disable
      - run:
          name: Install pnpm
          command: sudo npm i -g pnpm@11.9.0
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Run unit tests
          command: pnpm run test
      - run:
          name: Build the discovery artifacts
          command: pnpm run release:prepare-packages --compile-only --verbose

workflows:
  main:
    jobs:
      - tests
